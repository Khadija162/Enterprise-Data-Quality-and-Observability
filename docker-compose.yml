services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      REPORT_PATH: /app/artifacts/latest.json
      GOLD_PATH: /app/data/gold/quality_by_class.parquet
      LLM_MODE: mock
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./data/gold:/app/data/gold:ro
  dashboard:
    build: .
    command: ["streamlit","run","frontend/app.py","--server.address","0.0.0.0","--server.port","8501"]
    environment:
      API_URL: http://api:8000
    ports: ["127.0.0.1:8501:8501"]
    depends_on: [api]
